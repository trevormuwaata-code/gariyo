<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Motocraft">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F4F3EF">
<title>Motocraft</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Source+Sans+3:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F3EF; --card:#FFFFFF; --ink:#1C1C1C; --sub:#5A5856; --mute:#6B6864;
  --line:#E2DED9; --accent:#E8563A; --accent-ink:#B83A28; --ok:#2F7D4F; --ok-bg:#E5F2EA;
  --warn:#9A5B00; --warn-bg:#FBEFD9; --blue:#2F5F9E; --blue-bg:#E4ECF7;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Poppins',-apple-system,Arial,sans-serif;font-size:15px}
body{padding-top:env(safe-area-inset-top);padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 18px 10px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.mark{width:38px;height:38px;flex-shrink:0;display:block}
.brand{font-family:'Source Sans 3',-apple-system,Arial,sans-serif;font-weight:300;letter-spacing:4px;font-size:21px;line-height:1.1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand small{display:block;font-family:'Poppins',-apple-system,Arial,sans-serif;font-size:10px;letter-spacing:3px;color:var(--sub);font-weight:500;margin-top:2px}
.top .add{margin-left:auto}
.iconbtn{border:1px solid var(--line);background:transparent;border-radius:10px;width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
main{padding:16px 16px 24px;max-width:640px;margin:0 auto}
h2{font-size:22px;font-weight:600;margin:6px 0 14px}
h3{font-size:15px;font-weight:600;margin:22px 0 10px;color:var(--sub);text-transform:uppercase;letter-spacing:1.5px;font-size:12px}
.banner{margin:0 0 14px;padding:12px 14px;border-radius:12px;background:var(--warn-bg);color:var(--warn);font-size:13px;line-height:1.5}
.banner.lock{background:#FBE6E2;color:var(--accent-ink)}
.banner .btn{margin-top:10px}
.strip{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;margin:0 0 14px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:13px;cursor:pointer;text-align:left;min-height:44px}
.strip b{color:var(--accent-ink);font-weight:600;white-space:nowrap}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border-radius:14px;padding:14px;border:1px solid var(--line)}
.tile .n{font-size:26px;font-weight:600;line-height:1.1}
.tile .l{font-size:12px;color:var(--mute);margin-top:4px}
.tile.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.tile.dark .l{color:#C9C4BE}
.tile.wide{grid-column:span 2}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}
.row .grow{flex:1;min-width:0}
.t{font-weight:600;font-size:16px;overflow:hidden;text-overflow:ellipsis}
.s{font-size:13px;color:var(--mute);margin-top:2px}
.money{font-weight:600}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:4px 9px;border-radius:999px;background:#EEEBE7;color:var(--sub);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.blue{background:var(--blue-bg);color:var(--blue)}
.pill.red{background:#FBE6E2;color:var(--accent-ink)}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:11px 16px;min-height:44px;background:var(--ink);color:#fff;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn:disabled{opacity:.55}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.wa{background:#1F7A4C}
.btn.danger{background:transparent;color:var(--accent-ink);border:1px solid #F0C6BE}
.btn.danger.armed{background:var(--accent-ink);color:#fff;border-color:var(--accent-ink)}
.btn.small{padding:8px 12px;min-height:40px;font-size:13px}
.btn.full{width:100%}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;min-height:40px;white-space:nowrap;cursor:pointer;font-size:13px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.empty{text-align:center;color:var(--mute);padding:34px 16px;font-size:14px}
.note{font-size:12px;color:var(--mute);line-height:1.5}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
.kv.total{font-weight:600;font-size:16px}
.kv.big{font-size:19px;font-weight:600}
.pos{color:var(--ok)} .neg{color:var(--accent-ink)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:0;background:none;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--mute);cursor:pointer;min-height:56px}
nav.tabs button.on{color:var(--ink);font-weight:600}
nav.tabs button.on svg{stroke:var(--accent-ink)}
nav.tabs svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.overlay{position:fixed;inset:0;background:rgba(20,20,20,.45);z-index:20;display:none}
.overlay.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow-y:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
.grab{width:40px;height:5px;border-radius:3px;background:#CFCAC4;margin:6px auto 10px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.sheet-head h2{margin:0}
.fld{display:block;margin-bottom:12px}
.fld span{display:block;font-size:12px;font-weight:500;color:var(--sub);margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:12px;min-height:46px;font-size:16px}
.fld textarea{min-height:80px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid var(--ink);outline-offset:0;border-color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
details.rates summary{cursor:pointer;font-weight:500;padding:10px 0;min-height:44px}
.icon{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.devid{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:22px;letter-spacing:2px;font-weight:600;margin:4px 0 2px}
.powered{text-align:center;font-size:11px;letter-spacing:2px;color:var(--mute);margin:18px 0 4px}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumb{position:relative;width:76px;height:76px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#fff;flex:0 0 auto}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.add{display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;color:var(--sub);font-size:22px;font-weight:300;border-style:dashed}
.thumb.add span{font-size:11px;font-weight:500;margin-top:-2px}
.thumbx{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(20,20,20,.72);color:#fff;font-size:15px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<header class="top">
  <svg class="mark" viewBox="0 0 340 340" aria-hidden="true"><rect width="340" height="340" rx="72" fill="#1C1C1C"/><text id="markText" x="160" y="215" text-anchor="middle" fill="#fff" font-family="'Source Sans 3',Arial,sans-serif" font-weight="300" font-size="175" letter-spacing="4">M</text><circle cx="292" cy="170" r="17" fill="#E8563A"/></svg>
  <div class="brand"><span id="bizName">Motocraft</span><small id="bizTag">PREMIUM AUTO IMPORTS</small></div>
  <button class="btn small add" id="addBtn" type="button" aria-label="Add new">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span id="addLabel">Add</span>
  </button>
  <button class="iconbtn" id="setBtn" type="button" aria-label="Settings and backup">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
</header>
<main id="view"></main>

<nav class="tabs" aria-label="Sections">
  <button type="button" data-tab="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
  <button type="button" data-tab="cars"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 16h14v-4l-2-5H7l-2 5z"/><path d="M5 16v2M19 16v2M3 12h18"/><circle cx="8" cy="14" r=".6"/><circle cx="16" cy="14" r=".6"/></svg>Cars</button>
  <button type="button" data-tab="leads"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c1.8.7 3 2.4 3.5 5.2"/></svg>Buyers</button>
  <button type="button" data-tab="deals"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5M4 19h16"/><path d="M8 15l4-4 3 3 5-6"/></svg>Deals</button>
  <button type="button" data-tab="calc"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 11h2M12 11h2M16 11h0M8 15h2M12 15h2M8 18h2M12 18h2M16 15v3"/></svg>Calculator</button>
</nav>

<div class="overlay" id="overlay"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

// ---------- licence settings ----------
var VENDOR_NAME = 'Motocraft';
var VENDOR_WA = '256701083336';

// ---------- constants ----------
var CAR_STATUS = ['Sourcing','In transit','Available','Reserved','Sold'];
var CAR_SOURCE = ['Import – UK','Import – Japan','Import – Dubai','Import – Other','Own stock','Seller’s car'];
var LEAD_STAGE = ['New','Talking','Viewing','Deposit paid','Bought','Lost'];
var LEAD_SOURCE = ['WhatsApp status','Facebook','Instagram','TikTok','Snapchat','Referral','Walk-in / call','Other'];
var DEFAULT_RATES = {duty:25, vat:18, wht:6, infra:1.5, envOld:50, envAge:8, other:0};

var SCHEMA = {
  cars: [
    {k:'make',label:'Make',type:'text',ph:'Toyota',half:true,req:true},
    {k:'model',label:'Model',type:'text',ph:'Harrier',half:true},
    {k:'year',label:'Year',type:'num',ph:'2018',half:true},
    {k:'mileage',label:'Mileage (km)',type:'num',ph:'68,000',half:true},
    {k:'source',label:'Source',type:'select',opts:CAR_SOURCE,half:true},
    {k:'status',label:'Status',type:'select',opts:CAR_STATUS,half:true},
    {k:'askingPrice',label:'Asking price (UGX)',type:'num',ph:'45,000,000'},
    {k:'cost',label:'Your cost / landed cost (UGX)',type:'num',ph:'Leave blank for a seller’s car'},
    {k:'sellerName',label:'Seller name (if seller’s car)',type:'text',half:true},
    {k:'sellerPhone',label:'Seller phone',type:'tel',half:true},
    {k:'location',label:'Where the car is',type:'text',ph:'Yard / UK / Mombasa'},
    {k:'notes',label:'Notes',type:'area'}
  ],
  leads: [
    {k:'name',label:'Name',type:'text',req:true,half:true},
    {k:'phone',label:'Phone / WhatsApp',type:'tel',ph:'07xx xxx xxx',half:true},
    {k:'wants',label:'What they want',type:'text',ph:'Harrier or RAV4, 2016+'},
    {k:'budget',label:'Budget (UGX)',type:'num',ph:'40,000,000',half:true},
    {k:'payment',label:'Paying by',type:'select',opts:['Not sure','Cash','Loan / finance','Instalments'],half:true},
    {k:'timeline',label:'Buying when',type:'select',opts:['Not sure','This month','1–3 months','Later'],half:true},
    {k:'stage',label:'Stage',type:'select',opts:LEAD_STAGE,half:true},
    {k:'followUp',label:'Next follow-up',type:'date',half:true},
    {k:'source',label:'Came from',type:'select',opts:LEAD_SOURCE,half:true},
    {k:'notes',label:'Notes',type:'area'}
  ],
  deals: [
    {k:'carLabel',label:'Car',type:'text',ph:'2018 Toyota Harrier',req:true},
    {k:'buyer',label:'Buyer',type:'text',half:true},
    {k:'date',label:'Date',type:'date',half:true},
    {k:'salePrice',label:'Sale price (UGX) – if the car was yours',type:'num'},
    {k:'carCost',label:'What the car cost you (UGX)',type:'num'},
    {k:'commission',label:'Commission earned (UGX) – if brokering',type:'num'},
    {k:'expenses',label:'Other expenses (UGX)',type:'num',ph:'Transport, repairs, ads, referral fee'},
    {k:'handledBy',label:'Handled by (type any name)',type:'text',list:'peopleList'},
    {k:'notes',label:'Notes',type:'area'}
  ]
};

// ---------- local storage (data never leaves this phone) ----------
var LS = {
  get:function(k,d){ try{ var v=localStorage.getItem(k); return v==null?d:JSON.parse(v) }catch(e){ return d } },
  set:function(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); return true }catch(e){ return false } }
};
var DATA_KEY='mp_data_v1';

// ---------- state ----------
var S = {
  tab:'home', cars:[], leads:[], deals:[], rates:Object.assign({},DEFAULT_RATES),
  carFilter:'Active', leadFilter:'Active', licReady:false,
  biz:Object.assign({name:'Motocraft',tag:'PREMIUM AUTO IMPORTS'}, LS.get('mp_biz',{})),
  calc:{cur:'USD',price:'',ship:'',ins:'',fx:'',age:'',clearing:'',extra:'',target:''}
};
(function(){ var saved=LS.get('mp_calc',null); if(saved){ S.calc=Object.assign(S.calc,saved); } })();
function loadData(){ var d=LS.get(DATA_KEY,{})||{}; S.cars=d.cars||[]; S.leads=d.leads||[]; S.deals=d.deals||[]; S.rates=Object.assign({},DEFAULT_RATES,d.rates||{}); }
function saveData(){ return LS.set(DATA_KEY,{cars:S.cars,leads:S.leads,deals:S.deals,rates:S.rates,savedAt:Date.now()}) }
function newId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8) }
loadData();
try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}

// ---------- helpers ----------
function $(id){return document.getElementById(id)}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function num(v){ if(v==null||v==='') return 0; var n=parseFloat(String(v).replace(/[^0-9.\-]/g,'')); return isNaN(n)?0:n }
function ugx(n){ return 'UGX '+Math.round(num(n)).toLocaleString('en-US') }
function fmtIn(k,v){ if(k==='cur'||k==='age'||v==null||String(v).trim()==='') return v==null?'':v; var n=num(v); return n.toLocaleString('en-US',{maximumFractionDigits:2}) }
function short(n){ n=num(n); var a=Math.abs(n), s=n<0?'-':'';
  if(a>=1e9) return s+(a/1e9).toFixed(a>=1e10?0:1).replace(/\.0$/,'')+'B';
  if(a>=1e6) return s+(a/1e6).toFixed(a>=1e8?0:1).replace(/\.0$/,'')+'M';
  if(a>=1e3) return s+Math.round(a/1e3)+'K'; return s+Math.round(a) }
function today(){ var d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10) }
function fmtDate(s){ if(!s) return ''; var d=new Date(s+'T00:00:00'); if(isNaN(d)) return s; return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'}) }
function waLink(p){ var d=String(p||'').replace(/\D/g,''); if(!d) return ''; if(d.charAt(0)==='0') d='256'+d.slice(1); else if(d.length===9) d='256'+d; return 'https://wa.me/'+d }
function carLabel(c){ return [c.year,c.make,c.model].filter(Boolean).join(' ') || 'Car' }
var PHOTO_LIMIT=8, PHOTOS=[];
function photoKey(carId){ return 'mp_'+carId; }
var _idb=null;
function idb(){ if(_idb) return _idb; _idb=new Promise(function(res,rej){ try{ var r=indexedDB.open('motocraft',1); r.onupgradeneeded=function(){ try{r.result.createObjectStore('photos')}catch(e){} }; r.onsuccess=function(){res(r.result)}; r.onerror=function(){rej(r.error)}; }catch(e){ rej(e); } }); return _idb; }
function idbGet(k){ return idb().then(function(db){ return new Promise(function(res){ try{ var t=db.transaction('photos').objectStore('photos').get(k); t.onsuccess=function(){res(t.result||[])}; t.onerror=function(){res([])}; }catch(e){res([])} }); }).catch(function(){return []}); }
function idbSet(k,v){ return idb().then(function(db){ return new Promise(function(res,rej){ var t=db.transaction('photos','readwrite').objectStore('photos').put(v,k); t.onsuccess=function(){res()}; t.onerror=function(){rej(t.error)}; }); }); }
function idbDel(k){ return idb().then(function(db){ return new Promise(function(res){ try{ var t=db.transaction('photos','readwrite').objectStore('photos').delete(k); t.onsuccess=function(){res()}; t.onerror=function(){res()}; }catch(e){res()} }); }).catch(function(){}); }
function compressPhoto(file){ return new Promise(function(res){ var img=new Image(); img.onload=function(){ var mx=1280,w=img.width,h=img.height; if(w>h&&w>mx){h=Math.round(h*mx/w);w=mx;}else if(h>mx){w=Math.round(w*mx/h);h=mx;} var c=document.createElement('canvas'); c.width=w;c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); c.toBlob(function(b){URL.revokeObjectURL(img.src);res(b)},'image/jpeg',0.72); }; img.onerror=function(){res(null)}; img.src=URL.createObjectURL(file); }); }
function renderPhotoBox(){ var box=$('photoBox'); if(!box) return; var thumbs=PHOTOS.map(function(b,i){ var u=URL.createObjectURL(b); return '<div class="thumb"><img src="'+u+'" alt="Car photo"><button type="button" class="thumbx" data-rmphoto="'+i+'" aria-label="Remove photo">×</button></div>'; }).join(''); var canAdd=PHOTOS.length<PHOTO_LIMIT; box.innerHTML='<div class="thumbs">'+thumbs+(canAdd?'<label class="thumb add"><input type="file" id="photoIn" accept="image/*" multiple hidden>+<span>Add</span></label>':'')+'</div>'+'<p class="note" style="margin:4px 0 0">'+PHOTOS.length+' of '+PHOTO_LIMIT+' photos. Taken from your camera or gallery.</p>'; }
function addPhotos(files){ var list=Array.prototype.slice.call(files||[]); if(!list.length) return; var room=PHOTO_LIMIT-PHOTOS.length; if(room<=0){ toast('That’s the maximum of '+PHOTO_LIMIT+' photos.'); return; } list=list.slice(0,room); Promise.all(list.map(compressPhoto)).then(function(blobs){ blobs.forEach(function(b){ if(b) PHOTOS.push(b); }); renderPhotoBox(); }); }

// ---------- calculator ----------
function calcCompute(){
  var c=S.calc, r=S.rates;
  var fx=num(c.fx), gbp=num(c.price)+num(c.ship)+num(c.ins);
  var cif=gbp*fx, age=num(c.age);
  var envRate = (c.age!=='' && age>num(r.envAge)) ? num(r.envOld) : 0;
  var duty=cif*num(r.duty)/100;
  var other=cif*num(r.other)/100;
  var vat=(cif+duty+other)*num(r.vat)/100;
  var wht=cif*num(r.wht)/100;
  var infra=cif*num(r.infra)/100;
  var env=cif*envRate/100;
  var taxes=duty+other+vat+wht+infra+env;
  var landed=cif+taxes+num(c.clearing)+num(c.extra);
  var target=num(c.target);
  return {fx:fx,gbp:gbp,cif:cif,duty:duty,other:other,vat:vat,wht:wht,infra:infra,env:env,envRate:envRate,taxes:taxes,landed:landed,target:target,profit:target?target-landed:null};
}

  if(ce>15000000) warn+='<div class="banner">Clearing + transport adds up to '+esc(ugx(ce))+'. That looks too high, it is usually a few million. Check for an extra zero.</div>';
  var h=warn+'<div class="card">'+

    (num(r.other)?'<div class="kv"><span>Excise / other '+esc(r.other)+'%</span><span>'+esc(ugx(x.other))+'</span></div>':'')+
    '<div class="kv"><span>VAT '+esc(r.vat)+'%</span><span>'+esc(ugx(x.vat))+'</span></div>'+
    '<div class="kv"><span>Withholding tax '+esc(r.wht)+'%</span><span>'+esc(ugx(x.wht))+'</span></div>'+
    '<div class="kv"><span>Infrastructure levy '+esc(r.infra)+'%</span><span>'+esc(ugx(x.infra))+'</span></div>'+
    '<div class="kv"><span>Environmental levy '+esc(x.envRate)+'%'+(x.envRate?' (car is '+esc(num(r.envAge)+1)+'+ years old)':'')+'</span><span>'+esc(ugx(x.env))+'</span></div>'+
    (x.envRate?'<div class="kv" style="color:var(--warn)"><span>A car '+esc(num(r.envAge))+' years old or newer would save</span><span>'+esc(ugx(x.env))+'</span></div>':'')+
    '<div class="kv total"><span>Total URA taxes</span><span>'+esc(ugx(x.taxes))+'</span></div>'+
    '<div class="kv"><span>Clearing, registration, transport</span><span>'+esc(ugx(num(S.calc.clearing)+num(S.calc.extra)))+'</span></div>'+

  }
  h+='</div><button type="button" class="btn full" id="calcSave">Save as a car (Sourcing)</button>'+
    '<p class="note" style="margin-top:12px">Estimate only. URA values cars on its own valuation, which can differ from what you paid. Withholding tax can usually be claimed back against income tax. Confirm with your clearing agent before buying.</p>';
  return h;
}

function initials(name){ var w=String(name||'').trim().split(/\s+/); if(!w[0]) return ''; if(w[0].length<=3) return w[0].toUpperCase(); return (w[0].charAt(0)+(w[1]?w[1].charAt(0):'')).toUpperCase() }
function renderHeader(){
  $('bizName').textContent=S.biz.name||'My Cars';
  $('bizTag').textContent=S.biz.tag||'';
  var ini=initials(S.biz.name)||'•', mt=$('markText');
  mt.textContent=ini; mt.setAttribute('font-size', ini.length>=3?"125":"175");
  document.title=S.biz.name||'Car Dealer';
}
function render(){
  renderHeader();
  var v=$('view');
  v.innerHTML = ({home:viewHome,cars:viewCars,leads:viewLeads,deals:viewDeals,calc:viewCalc})[S.tab]();
  document.querySelectorAll('nav.tabs button').forEach(function(b){ var on=b.getAttribute('data-tab')===S.tab; b.classList.toggle('on',on); if(on) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current') });
  var lab={home:'Buyer',cars:'Car',leads:'Buyer',deals:'Deal',calc:''}[S.tab];
  $('addBtn').style.display = lab?'':'none';
  $('addLabel').textContent='Add '+lab.toLowerCase();
}
function rerenderData(){ if(S.tab==='calc'){ var o=$('calcOut'); if(o) o.innerHTML=calcResultsHtml(); return; } render(); }

// ---------- form sheet ----------
var FORM = null;
var SETTINGS = false;
function fieldHtml(f,v){
  var name='name="'+f.k+'"', val=v==null?'':v, inner;
  if(f.type==='select'){
    inner='<select '+name+'>'+f.opts.map(function(o){return '<option'+(o===val?' selected':'')+'>'+esc(o)+'</option>'}).join('')+'</select>';
  } else if(f.type==='area'){
    inner='<textarea '+name+'>'+esc(val)+'</textarea>';
  } else if(f.type==='num'){
    var shown = (val===''||val==null)?'':Math.round(num(val)).toLocaleString('en-US');
    if(f.k==='year') shown = val===''?'':String(Math.round(num(val)));
    inner='<input '+name+' inputmode="numeric" value="'+esc(shown)+'" placeholder="'+esc(f.ph||'')+'">';
  } else {
    inner='<input '+name+' type="'+(f.type==='tel'?'tel':f.type==='date'?'date':'text')+'" value="'+esc(val)+'" placeholder="'+esc(f.ph||'')+'"'+(f.req?' required':'')+(f.list?' list="'+f.list+'"':'')+'>'+(f.list?peopleDatalist():'');
  }
  return '<label class="fld"><span>'+esc(f.label)+'</span>'+inner+'</label>';
}
function openSheet(h){ $('sheet').innerHTML=h; $('overlay').classList.add('open'); document.body.style.overflow='hidden'; $('sheet').scrollTop=0; }
function openForm(kind,id,prefill,afterSave){
  if(guard()) return;
  var existing = id ? S[kind].filter(function(x){return x.id===id})[0] : null;
  var data = Object.assign({}, existing||{}, prefill||{});
  if(!existing){
    if(kind==='cars' && !data.status) data.status='Available';
    if(kind==='leads'){ if(!data.stage) data.stage='New'; if(!data.followUp){ var d=new Date(); d.setDate(d.getDate()+2); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); data.followUp=d.toISOString().slice(0,10);} }
    if(kind==='deals' && !data.date) data.date=today();
  }
  SETTINGS=false; SOLD=null;
  FORM={kind:kind,id:id||null,existing:existing,afterSave:afterSave,prevStatus:existing?existing.status:null};
  var title={cars:'car',leads:'buyer',deals:'deal'}[kind];
  var fs=SCHEMA[kind], h='<div class="grab" aria-hidden="true"></div><div class="sheet-head"><h2>'+(existing?'Edit ':'New ')+title+'</h2><button type="button" class="btn small ghost" data-close>Close</button></div><form id="theForm" novalidate>';
  for(var i=0;i<fs.length;i++){
    var f=fs[i];
    if(f.half && fs[i+1] && fs[i+1].half){ h+='<div class="two">'+fieldHtml(f,data[f.k])+fieldHtml(fs[i+1],data[fs[i+1].k])+'</div>'; i++; }
    else h+=fieldHtml(f,data[f.k]);
  }
  if(kind==='deals') h+='<div class="card" id="dealProfit" style="margin:4px 0 12px"></div>';
  if(kind==='cars') h+='<label class="fld"><span>Photos</span></label><div id="photoBox" style="margin-bottom:12px"></div>';
  h+='<button type="submit" class="btn full">Save</button>';
  if(existing) h+='<div style="margin-top:12px"><button type="button" class="btn full danger" id="delBtn">Delete</button></div>';
  h+='</form>';
  openSheet(h);
  if(kind==='deals') updateDealProfit();
  if(kind==='cars'){ PHOTOS=[]; renderPhotoBox(); if(id) idbGet(photoKey(id)).then(function(arr){ PHOTOS=(arr||[]).slice(); renderPhotoBox(); }); }
  var first=$('sheet').querySelector('input,select'); if(first && !existing) setTimeout(function(){ try{first.focus()}catch(e){} },50);
}
function closeForm(){ $('overlay').classList.remove('open'); document.body.style.overflow=''; FORM=null; SOLD=null; SETTINGS=false; PENDING_RESTORE=null; PHOTOS=[]; }
function readForm(){
  var fs=SCHEMA[FORM.kind], form=$('theForm'), out={};
  fs.forEach(function(f){ var el=form.elements[f.k]; if(!el) return; var v=el.value.trim(); out[f.k] = f.type==='num' ? (v===''?'':num(v)) : v; });
  return out;
}
function updateDealProfit(){ var box=$('dealProfit'); if(!box||!FORM) return; var d=readForm(), p=dealProfit(d); box.innerHTML='<div class="kv big" style="border:0"><span>Profit</span><span class="'+(p>=0?'pos':'neg')+'">'+esc(ugx(p))+'</span></div>'; }

function handleWriteError(e){
  var code=e&&e.code;
  if(code==='quota_exceeded') toast('Phone storage for this app is full. Back up, then delete some old records.');
  else if(code!=='none') toast('Couldn’t save. Try again.');
}
function writeDoc(kind,id,data){
  if(isLocked()){ guard(); return Promise.reject({code:'none'}); }
  var nid=id||newId(), arr=S[kind], rec=Object.assign({},data,{id:nid}), idx=-1;
  for(var i=0;i<arr.length;i++){ if(arr[i].id===nid){ idx=i; break; } }
  var prev=idx>=0?arr[idx]:null;
  if(idx>=0) arr[idx]=rec; else arr.push(rec);
  if(!saveData()){ if(prev) arr[idx]=prev; else arr.pop(); return Promise.reject({code:'quota_exceeded'}); }
  rerenderData();
  return Promise.resolve(nid);
}
function submitForm(){
  var kind=FORM.kind, data=readForm(), ex=FORM.existing;
  if(kind==='cars' && !data.make){ toast('Add the make at least.'); return; }
  if(kind==='leads' && !data.name){ toast('Add the buyer’s name.'); return; }
  if(kind==='deals' && !data.carLabel){ toast('Say which car the deal was for.'); return; }
  var now=Date.now();
  var full=Object.assign({}, ex?stripId(ex):{}, data, {updatedAt:now, createdAt:(ex&&ex.createdAt)||now});
  var becameSold = kind==='cars' && data.status==='Sold' && FORM.prevStatus!=='Sold';
  var after=FORM.afterSave;
  var photos = kind==='cars' ? PHOTOS.slice() : null;
  writeDoc(kind,FORM.id,full).then(function(newId){
    var done=function(){ closeForm(); toast('Saved'); if(after) after(newId); if(becameSold || (kind==='cars' && data.status==='Sold' && !dealForCar(newId))) openSoldSheet(newId, Object.assign({id:newId},full)); };
    if(kind==='cars'){ PHOTOS=photos; persistPhotos(newId).then(done,done); } else done();
  }).catch(handleWriteError);
}
function stripId(o){ var c=Object.assign({},o); delete c.id; return c; }
function deleteCurrent(){
  var kind=FORM.kind, id=FORM.id;
  if(!id || guard()) return;
  var keep=S[kind];
  S[kind]=keep.filter(function(x){return x.id!==id});
  if(!saveData()){ S[kind]=keep; toast('Couldn’t delete. Try again.'); return; }
  if(kind==='cars') idbDel(photoKey(id));
  closeForm(); toast('Deleted'); rerenderData();
}
function peopleNames(){ var seen={}, out=[]; S.deals.map(function(d){return d.handledBy}).forEach(function(n){ n=String(n||'').trim(); if(n && !seen[n.toLowerCase()]){ seen[n.toLowerCase()]=1; out.push(n); } }); return out; }
function peopleDatalist(){ return '<datalist id="peopleList">'+peopleNames().map(function(n){return '<option value="'+esc(n)+'"></option>'}).join('')+'</datalist>'; }
function dealForCar(id){ return S.deals.filter(function(d){return d.carId===id})[0] || null }

// ---------- mark sold: one sheet updates the car AND records the profit ----------
var SOLD=null;
function soldVals(){
  var f=$('soldForm'); if(!f) return {};
  function g(k){ var el=f.elements[k]; return el?el.value.trim():'' }
  return {soldPrice:num(g('soldPrice')), carCost:num(g('carCost')), commission:num(g('commission')), expenses:num(g('expenses')), buyer:g('buyer'), date:g('date')||today(), handledBy:g('handledBy')};
}
function soldProfit(v){ return SOLD.seller ? v.commission - v.expenses : v.soldPrice - v.carCost + v.commission - v.expenses }
function updateSoldProfit(){
  var box=$('soldProfit'); if(!box||!SOLD) return;
  var p=soldProfit(soldVals());
  box.innerHTML='<div class="kv big" style="border:0"><span>Your profit</span><span class="'+(p>=0?'pos':'neg')+'">'+esc(ugx(p))+'</span></div>';
}
function openSoldSheet(carId, carObj){
  if(guard()) return;
  var car = carObj || S.cars.filter(function(c){return c.id===carId})[0]; if(!car) return;
  var dl = dealForCar(car.id);
  var seller = car.source==='Seller’s car';
  SOLD={car:car, deal:dl, seller:seller};
  FORM=null; SETTINGS=false;
  function money(v){ return (v===''||v==null||num(v)===0)?'':Math.round(num(v)).toLocaleString('en-US') }
  var price = car.soldPrice || (dl&&(dl.soldFor||dl.salePrice)) || car.askingPrice;
  var cost = dl ? dl.carCost : car.cost;
  var buyerOpts = S.leads.filter(isActiveLead).map(function(l){return '<option value="'+esc(l.name)+'"></option>'}).join('');
  var h='<div class="grab" aria-hidden="true"></div><div class="sheet-head"><h2>'+(car.status==='Sold'?'Sale details':'Mark sold')+'</h2><button type="button" class="btn small ghost" data-close>Close</button></div>'+
    '<p class="s" style="margin:0 0 12px">'+esc(carLabel(car))+'</p><form id="soldForm" novalidate>'+
    '<label class="fld"><span>Sold for (UGX)</span><input name="soldPrice" inputmode="numeric" value="'+esc(money(price))+'"></label>';
  if(seller){
    h+='<label class="fld"><span>Your commission (UGX)</span><input name="commission" inputmode="numeric" value="'+esc(money(dl&&dl.commission))+'" placeholder="What the seller paid you"></label>';
  } else {
    h+='<label class="fld"><span>What the car cost you (UGX)</span><input name="carCost" inputmode="numeric" value="'+esc(money(cost))+'"></label>';
  }
  h+='<label class="fld"><span>Other expenses (UGX)</span><input name="expenses" inputmode="numeric" value="'+esc(money(dl&&dl.expenses))+'" placeholder="Transport, repairs, ads, referral fee"></label>'+
    '<div class="two"><label class="fld"><span>Buyer</span><input name="buyer" list="buyerList" value="'+esc(car.buyer||(dl&&dl.buyer)||'')+'"></label>'+
    '<label class="fld"><span>Date</span><input name="date" type="date" value="'+esc(car.soldDate||(dl&&dl.date)||today())+'"></label></div>'+
    '<datalist id="buyerList">'+buyerOpts+'</datalist>'+
    '<label class="fld"><span>Handled by (type any name)</span><input name="handledBy" list="peopleList" value="'+esc((dl&&dl.handledBy)||'')+'"></label>'+peopleDatalist()+
    '<div class="card" id="soldProfit" style="margin:4px 0 12px"></div>'+
    '<button type="submit" class="btn full">Save sale</button></form>';
  openSheet(h);
  updateSoldProfit();
}
function submitSold(){
  var v=soldVals(), car=SOLD.car, dl=SOLD.deal, seller=SOLD.seller, now=Date.now();
  if(!v.soldPrice && !(seller && v.commission)){ toast('Enter what the car sold for.'); return; }
  var carBody=Object.assign(stripId(car),{status:'Sold',soldPrice:v.soldPrice,soldDate:v.date,buyer:v.buyer,updatedAt:now,createdAt:car.createdAt||now});
  var dealBody=Object.assign(dl?stripId(dl):{}, {
    carId:car.id, carLabel:carLabel(car), buyer:v.buyer, date:v.date, handledBy:v.handledBy,
    soldFor:v.soldPrice,
    salePrice: seller?0:v.soldPrice, carCost: seller?0:v.carCost,
    commission: seller?v.commission:(dl?num(dl.commission):0), expenses:v.expenses,
    updatedAt:now, createdAt:(dl&&dl.createdAt)||now
  });
  writeDoc('cars',car.id,carBody).then(function(){ return writeDoc('deals',dl?dl.id:null,dealBody) }).then(function(){
    closeForm(); toast('Sale saved – profit '+short(dealProfit(dealBody)));
  }).catch(handleWriteError);
}

// ---------- settings: licence, business name, backup ----------
var PENDING_RESTORE=null;
function vendorWa(text){ return 'https://wa.me/'+VENDOR_WA+'?text='+encodeURIComponent(text) }
function openSettings(){
  FORM=null; SOLD=null; SETTINGS=true; PENDING_RESTORE=null;
  var lb=LS.get('mp_lastBackup',0);
  var canShare=false; try{ canShare=!!(navigator.canShare && navigator.canShare({files:[new File(['x'],'x.json',{type:'application/json'})]})) }catch(e){}
  var h='<div class="grab" aria-hidden="true"></div><div class="sheet-head"><h2>Settings</h2><button type="button" class="btn small ghost" data-close>Close</button></div>'+
    '<h3>Business</h3><div class="card">'+
      '<label class="fld"><span>Business name</span><input id="bizNameIn" value="'+esc(S.biz.name)+'" maxlength="28"></label>'+
      '<label class="fld"><span>Tagline (optional)</span><input id="bizTagIn" value="'+esc(S.biz.tag)+'" maxlength="32"></label>'+
      '<button type="button" class="btn small ghost" id="bizSave">Save name</button>'+
    '</div>'+
    '<h3>Backup</h3><div class="card">'+
      '<p class="note" style="margin-top:0">Your cars, buyers and deals are stored only on this phone. If the phone is lost or reset, they are gone unless you have a backup. Back up every week and keep the file somewhere safe, like your WhatsApp “Message yourself” chat or Google Drive.</p>'+
      '<p class="s">'+(lb?'Last backup: '+esc(new Date(lb).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})):'No backup yet')+' · '+S.cars.length+' cars, '+S.leads.length+' buyers, '+S.deals.length+' deals</p>'+
      '<div class="actions">'+(canShare?'<button type="button" class="btn small" id="shareBackup">Send backup (WhatsApp, Drive…)</button>':'')+
      '<button type="button" class="btn small '+(canShare?'ghost':'')+'" id="dlBackup">Download backup</button></div>'+
      '<label class="fld" style="margin-top:14px"><span>Restore from a backup file</span><input type="file" id="restoreFile" accept=".json,application/json"></label>'+
      '<div id="restoreBox"></div>'+
    '</div>'+
    '<div class="powered">MOTOCRAFT · PREMIUM AUTO IMPORTS</div>';
  openSheet(h);
}
function backupPayload(){ return {app:'motocraft-dealer',version:1,business:S.biz,exportedAt:new Date().toISOString(),cars:S.cars,leads:S.leads,deals:S.deals,rates:S.rates} }
function backupName(){ return (String(S.biz.name||'cars').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'')||'cars')+'-backup-'+today()+'.json' }
function markBackedUp(){ LS.set('mp_lastBackup',Date.now()); toast('Backup ready'); }
function downloadBackup(){
  var blob=new Blob([JSON.stringify(backupPayload())],{type:'application/json'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=backupName();
  document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },1500);
  markBackedUp(); openSettings();
}
function shareBackup(){
  var file=new File([JSON.stringify(backupPayload())],backupName(),{type:'application/json'});
  navigator.share({files:[file],title:backupName()}).then(function(){ markBackedUp(); openSettings(); }).catch(function(e){ if(e && e.name!=='AbortError') downloadBackup(); });
}
function readRestore(file){
  var box=$('restoreBox'); if(!file||!box) return;
  var r=new FileReader();
  r.onload=function(){
    var d=null; try{ d=JSON.parse(r.result) }catch(e){}
    if(!d || !Array.isArray(d.cars) || !Array.isArray(d.leads) || !Array.isArray(d.deals)){ box.innerHTML='<div class="banner lock">That file isn’t a backup from this app.</div>'; PENDING_RESTORE=null; return; }
    PENDING_RESTORE=d;
    box.innerHTML='<div class="banner">This backup'+(d.exportedAt?' from '+esc(new Date(d.exportedAt).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})):'')+' has '+d.cars.length+' cars, '+d.leads.length+' buyers and '+d.deals.length+' deals. Restoring replaces everything currently on this phone.</div>'+
      '<button type="button" class="btn full danger" id="restoreGo">Replace my data with this backup</button>';
  };
  r.readAsText(file);
}
function doRestore(){
  var d=PENDING_RESTORE; if(!d) return;
  var old={cars:S.cars,leads:S.leads,deals:S.deals,rates:S.rates};
  S.cars=d.cars; S.leads=d.leads; S.deals=d.deals; S.rates=Object.assign({},DEFAULT_RATES,d.rates||{});
  if(!saveData()){ S.cars=old.cars; S.leads=old.leads; S.deals=old.deals; S.rates=old.rates; toast('Couldn’t restore. Phone storage is full.'); return; }
  if(d.business && d.business.name){ S.biz=Object.assign({},S.biz,d.business); LS.set('mp_biz',S.biz); }
  closeForm(); render(); toast('Backup restored');
}


// ---------- events ----------
document.addEventListener('click',function(e){
  var t=e.target.closest('button,a'); if(!t) return;
  if(t.hasAttribute('data-tab')){ S.tab=t.getAttribute('data-tab'); render(); window.scrollTo(0,0); return; }
  if(t.id==='addBtn'){ var k={home:'leads',cars:'cars',leads:'leads',deals:'deals'}[S.tab]; if(k) openForm(k); return; }
  if(t.id==='setBtn' || t.hasAttribute('data-settings')){ openSettings(); return; }
  if(t.hasAttribute('data-new')){ openForm(t.getAttribute('data-new')); return; }
  if(t.hasAttribute('data-edit')){ openForm(t.getAttribute('data-edit'),t.getAttribute('data-id')); return; }
  if(t.hasAttribute('data-close')){ closeForm(); return; }
  if(t.hasAttribute('data-carf')){ S.carFilter=t.getAttribute('data-carf'); render(); return; }
  if(t.hasAttribute('data-leadf')){ S.leadFilter=t.getAttribute('data-leadf'); render(); return; }
  if(t.hasAttribute('data-sold')){ openSoldSheet(t.getAttribute('data-sold')); return; }
  if(t.hasAttribute('data-snooze')){
    var l=S.leads.filter(function(x){return x.id===t.getAttribute('data-snooze')})[0]; if(!l) return;
    var d=new Date(); d.setDate(d.getDate()+3); d.setMinutes(d.getMinutes()-d.getTimezoneOffset());
    writeDoc('leads',l.id,Object.assign(stripId(l),{followUp:d.toISOString().slice(0,10),stage:l.stage==='New'?'Talking':l.stage,updatedAt:Date.now()}))
      .then(function(){toast('Follow-up set for '+fmtDate(d.toISOString().slice(0,10)))}).catch(handleWriteError);
    return;
  }
  if(t.id==='delBtn'){
    if(t.classList.contains('armed')) deleteCurrent();
    else { t.classList.add('armed'); t.textContent='Tap again to delete'; setTimeout(function(){ if(t.isConnected){ t.classList.remove('armed'); t.textContent='Delete'; } },4000); }
    return;
  }
  if(t.hasAttribute('data-rmphoto')){ PHOTOS.splice(+t.getAttribute('data-rmphoto'),1); renderPhotoBox(); return; }
  if(t.hasAttribute('data-share')){ shareCar(t.getAttribute('data-share')); return; }
  if(t.hasAttribute('data-catalogue')){ shareCatalogue(); return; }
  if(t.id==='calcSave'){
    var x=calcCompute();
    var src={GBP:['Import – UK','UK'],JPY:['Import – Japan','Japan'],AED:['Import – Dubai','Dubai']}[S.calc.cur]||['Import – Other',''];
    openForm('cars',null,{source:src[0],status:'Sourcing',cost:Math.round(x.landed),askingPrice:x.target?Math.round(x.target):'',location:src[1],
      year: S.calc.age!==''?String(new Date().getFullYear()-Math.round(num(S.calc.age))):''});
    return;
  }
  if(t.id==='ratesReset'){ S.rates=Object.assign({},DEFAULT_RATES); saveRates(); render(); return; }
  if(t.id==='bizSave'){ S.biz={name:$('bizNameIn').value.trim()||'Motocraft',tag:$('bizTagIn').value.trim()}; LS.set('mp_biz',S.biz); renderHeader(); toast('Name saved'); return; }
  if(t.id==='dlBackup'){ downloadBackup(); return; }
  if(t.id==='shareBackup'){ shareBackup(); return; }
  if(t.id==='restoreGo'){ doRestore(); return; }
});
$('overlay').addEventListener('click',function(e){ if(e.target.id==='overlay') closeForm(); });
document.addEventListener('keydown',function(e){ if(e.key==='Escape' && (FORM||SOLD||SETTINGS)) closeForm(); });
document.addEventListener('submit',function(e){ if(e.target.id==='theForm'){ e.preventDefault(); submitForm(); } else if(e.target.id==='soldForm'){ e.preventDefault(); submitSold(); } });
document.addEventListener('change',function(e){
  var el=e.target;
  if(el.id==='restoreFile'){ readRestore(el.files&&el.files[0]); return; }
  if(el.id==='photoIn'){ addPhotos(el.files); el.value=''; return; }
  if(!el.hasAttribute || !el.hasAttribute('data-calc')) return;
  var k=el.getAttribute('data-calc'); if(k==='cur'||k==='age') return;
  var f=fmtIn(k,el.value); if(f!==el.value){ el.value=f; S.calc[k]=f; LS.set('mp_calc',S.calc); }
});
document.addEventListener('input',function(e){
  var el=e.target;
  if(el.hasAttribute && el.hasAttribute('data-calc')){
    var ck=el.getAttribute('data-calc'); S.calc[ck]=el.value;
    if(ck==='cur'){ S.calc.fx=''; }
    LS.set('mp_calc',S.calc);
    if(ck==='cur'){ render(); return; }
    var o=$('calcOut'); if(o) o.innerHTML=calcResultsHtml(); return;
  }
  if(el.hasAttribute && el.hasAttribute('data-rate')){
    S.rates[el.getAttribute('data-rate')]=el.value;
    var o2=$('calcOut'); if(o2) o2.innerHTML=calcResultsHtml();
    clearTimeout(saveRates._t); saveRates._t=setTimeout(saveRates,600); return;
  }
  if(FORM && FORM.kind==='deals' && el.closest && el.closest('#theForm')) updateDealProfit();
  if(SOLD && el.closest && el.closest('#soldForm')) updateSoldProfit();
});
function saveRates(){ Object.keys(DEFAULT_RATES).forEach(function(k){ S.rates[k]=num(S.rates[k]) }); saveData(); }

// ---------- start ----------
seedIfEmpty();
render();
document.addEventListener('visibilitychange',function(){ if(!document.hidden && !$('overlay').classList.contains('open')) render(); });
if('serviceWorker' in navigator && location.protocol==='https:'){ navigator.serviceWorker.register('sw.js').catch(function(){}); }

})();
</script>
</body>
